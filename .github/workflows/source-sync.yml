name: Install GATEPath CS-only source
on:
  push:
    branches: [vercel-preview]
    paths:
      - "cs-release-payload/**"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Install complete CS-only source
        shell: bash
        run: |
          set -euo pipefail
          cat cs-release-payload/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/gatepath-cs.zip
          unzip -t /tmp/gatepath-cs.zip
          mkdir -p /tmp/gatepath-cs
          unzip -q /tmp/gatepath-cs.zip -d /tmp/gatepath-cs
          test -f /tmp/gatepath-cs/index.py
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name cs-release-payload -exec rm -rf {} +
          cp -a /tmp/gatepath-cs/. .
          rm -rf cs-release-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release CS-only GATEPath 2027 preparation workspace"
          git push origin HEAD:vercel-preview
