name: Restore complete GATEPath source
on:
  push:
    branches: [main]
    paths:
      - "release-payload/**"
      - ".github/workflows/restore-source.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Reconstruct and install the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          cat release-payload/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/gatepath.zip
          unzip -t /tmp/gatepath.zip
          mkdir -p /tmp/gatepath
          unzip -q /tmp/gatepath.zip -d /tmp/gatepath
          test -d /tmp/gatepath/GATEPath-2027
          cp -a /tmp/gatepath/GATEPath-2027/. .
          rm -rf release-payload
          rm -f .github/workflows/restore-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Upload complete GATEPath 2027 application"
          git push origin HEAD:main
