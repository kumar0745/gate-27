services:
  - type: web
    name: gatepath-2027
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    disk:
      name: gatepath-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: GATEPATH_DATABASE_PATH
        value: /var/data/gatepath.db
      - key: GATEPATH_SECURE_COOKIES
        value: "true"
      - key: GATEPATH_ADMIN_EMAIL
        sync: false
      - key: GATEPATH_ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
